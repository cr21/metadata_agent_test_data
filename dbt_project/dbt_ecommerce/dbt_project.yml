name: 'ecommerce'
version: '1.0.0'
config-version: 2

profile: 'default' # Matches the profile in your local ~/.dbt/profiles.yml

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_test_project:
    staging:
      +materialized: view
    marts:
      +materialized: table